<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoSignal SOS · Rescue Control</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
    --red: #ff4d4f; --orange: #ffa940; --green: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  .brand span { color: var(--red); }
  .stats { display: flex; gap: 20px; margin-left: auto; }
  .stat b { display: block; font-size: 24px; line-height: 1; }
  .stat small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .stat.crit b { color: var(--red); }
  .pill { padding: 4px 10px; border-radius: 99px; font-size: 13px; border: 1px solid var(--line); }
  .pill.ok { color: var(--green); border-color: var(--green); }
  .pill.warn { color: var(--orange); border-color: var(--orange); }
  button { background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #map { height: 100%; min-height: 300px; background: #0b0f14; }
  /* Turn the standard light map into a dark one for the projector */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  aside h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 4px 4px 12px; }
  .empty { color: var(--muted); padding: 24px 8px; text-align: center; line-height: 1.5; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--orange);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .card.critical { border-left-color: var(--red); }
  .card.fresh { animation: flash 1.6s ease-out 2; }
  @keyframes flash { 0% { background: rgba(255,77,79,.35); } 100% { background: var(--panel); } }
  .card .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .card .time { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
  .tags { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #30363d; }
  .tag.crit { background: rgba(255,77,79,.2); color: #ffa198; }
  .msg { font-style: italic; margin: 4px 0; }
  .route { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .route b { color: var(--text); }
  .sim { font-size: 11px; color: var(--orange); margin-left: 6px; }
  .pin { width: 22px; height: 22px; border-radius: 50%; background: var(--orange); border: 3px solid #fff;
    box-shadow: 0 0 0 0 rgba(255,169,64,.7); animation: pulse 1.8s infinite; }
  .pin.critical { background: var(--red); box-shadow: 0 0 0 0 rgba(255,77,79,.7); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 18px rgba(255,77,79,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,79,0); } }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    width: min(520px, calc(100vw - 32px)); }
  dialog input { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; margin: 8px 0 14px; }
  dialog p { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .stats { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">📡 NoSignal <span>SOS</span> · Rescue Control</div>
  <span id="status" class="pill warn">Not connected</span>
  <div class="stats">
    <div class="stat crit"><b id="statCritical">0</b><small>Critical</small></div>
    <div class="stat"><b id="statSos">0</b><small>SOS alerts</small></div>
    <div class="stat"><b id="statPeople">0</b><small>People</small></div>
  </div>
  <button id="simBtn" title="Adds a fake SOS for rehearsal (not saved anywhere)">＋ Simulate SOS</button>
  <button id="settingsBtn">⚙ Settings</button>
</header>
<main>
  <div id="map"></div>
  <aside>
    <h2>Incoming SOS</h2>
    <div id="list"><div class="empty">Waiting for SOS messages…<br>They appear here the moment any phone in the mesh reaches the internet.</div></div>
  </aside>
</main>

<dialog id="settings">
  <h3>Firebase connection</h3>
  <p>Paste the same Realtime Database URL you put in <code>lib/config.dart</code>.</p>
  <input id="dbInput" placeholder="https://your-project-default-rtdb.firebaseio.com">
  <div class="row">
    <button id="clearSim">Remove simulated SOS</button>
    <button id="closeSettings">Cancel</button>
    <button id="saveSettings">Save &amp; connect</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CRITICAL = ['Injured', 'Trapped', 'Medical emergency', 'Fire'];
const messages = {};          // id -> message
const markers = {};           // id -> Leaflet marker
let source = null;
let snapshotLoaded = false;

// ---------- storage helpers (may be blocked in private windows)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const DEFAULT_DB = 'https://nosignal-sos-default-rtdb.asia-southeast1.firebasedatabase.app';
let dbUrl = new URLSearchParams(location.search).get('db') || store.get('nosignal.db') || DEFAULT_DB;

// ---------- map
const map = L.map('map', { zoomControl: true }).setView([20.59, 78.96], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

// ---------- helpers
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isCritical = m => (m.tags || []).some(t => CRITICAL.includes(t));
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}
function setStatus(text, kind) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'pill ' + kind;
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}

// ---------- data
function upsert(id, m, isNew) {
  const fresh = isNew && !messages[id];
  messages[id] = { ...m, id, _fresh: fresh };
  if (fresh) {
    beep();
    if (m.lat != null && m.lng != null) map.flyTo([m.lat, m.lng], 16, { duration: 1.5 });
  }
}
function remove(id) { delete messages[id]; }

// Firebase streams changes as Server-Sent Events: "put" replaces data at a path, "patch" merges.
function applyEvent(evt, isPatch) {
  const { path, data } = JSON.parse(evt.data);
  const live = snapshotLoaded;
  if (path === '/') {
    if (!isPatch) Object.keys(messages).forEach(id => { if (!messages[id]._sim) remove(id); });
    for (const [id, m] of Object.entries(data || {})) m ? upsert(id, m, live) : remove(id);
  } else {
    const [id, ...rest] = path.split('/').filter(Boolean);
    if (rest.length === 0) data ? upsert(id, data, live) : remove(id);
    else if (messages[id]) messages[id][rest[0]] = data;
  }
  snapshotLoaded = true;
  render();
}

function connect() {
  if (source) source.close();
  snapshotLoaded = false;
  if (!dbUrl) { setStatus('Not connected · open ⚙ Settings', 'warn'); return; }
  source = new EventSource(dbUrl.replace(/\/$/, '') + '/sos.json');
  source.onopen = () => setStatus('● Live', 'ok');
  source.onerror = () => setStatus('Reconnecting…', 'warn');
  source.addEventListener('put', e => applyEvent(e, false));
  source.addEventListener('patch', e => applyEvent(e, true));
  source.addEventListener('cancel', () => setStatus('Access denied · check database rules', 'warn'));
}

// ---------- rendering
function render() {
  const list = Object.values(messages).sort((a, b) => b.createdAt - a.createdAt);
  document.getElementById('statSos').textContent = list.length;
  document.getElementById('statCritical').textContent = list.filter(isCritical).length;
  document.getElementById('statPeople').textContent = list.reduce((n, m) => n + (m.people || 1), 0);

  // markers
  for (const id of Object.keys(markers)) {
    if (!messages[id]) { map.removeLayer(markers[id]); delete markers[id]; }
  }
  for (const m of list) {
    if (m.lat == null || m.lng == null) continue;
    const icon = L.divIcon({ className: '', html: `<div class="pin ${isCritical(m) ? 'critical' : ''}"></div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
    const popup = `<b>${esc(m.sender)}</b><br>${esc((m.tags || []).join(', '))}<br>${esc(m.text)}<br><small>${m.people || 1} people · ${(m.path || []).length - 1} hops</small>`;
    if (markers[m.id]) markers[m.id].setIcon(icon).setPopupContent(popup);
    else markers[m.id] = L.marker([m.lat, m.lng], { icon }).bindPopup(popup).addTo(map);
  }

  // list
  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = '<div class="empty">Waiting for SOS messages…<br>They appear here the moment any phone in the mesh reaches the internet.</div>';
    return;
  }
  el.innerHTML = list.map(m => {
    const path = m.path || [m.sender];
    const hops = path.length - 1;
    return `<div class="card ${isCritical(m) ? 'critical' : ''} ${m._fresh ? 'fresh' : ''}" data-id="${esc(m.id)}">
      <div class="top"><span>🆘 ${esc(m.sender)}${m._sim ? '<span class="sim">SIMULATED</span>' : ''}</span><span class="time" data-t="${m.createdAt}">${ago(m.createdAt)}</span></div>
      <div class="tags">${(m.tags || []).map(t => `<span class="tag ${CRITICAL.includes(t) ? 'crit' : ''}">${esc(t)}</span>`).join('')}<span class="tag">👥 ${m.people || 1}</span></div>
      ${m.text ? `<div class="msg">“${esc(m.text)}”</div>` : ''}
      ${m.lat == null ? '<div class="route">📍 No GPS fix</div>' : ''}
      <div class="route">Route: <b>${path.map(esc).join(' → ')}</b> → ☁️ (${hops} hop${hops === 1 ? '' : 's'} offline)</div>
    </div>`;
  }).join('');
  list.forEach(m => { m._fresh = false; });
}

document.getElementById('list').addEventListener('click', e => {
  const card = e.target.closest('.card');
  const marker = card && markers[card.dataset.id];
  if (marker) { map.flyTo(marker.getLatLng(), 17, { duration: 1 }); marker.openPopup(); }
});
setInterval(() => document.querySelectorAll('.time[data-t]').forEach(el => { el.textContent = ago(+el.dataset.t); }), 10000);

// ---------- simulate (rehearsal backup, never written to Firebase)
const SIM_TEXTS = ['Water rising, on the roof', 'Grandmother needs insulin', 'Wall collapsed, leg stuck', 'No food since yesterday', ''];
let simCount = 0;
document.getElementById('simBtn').onclick = () => {
  const c = map.getCenter();
  const tags = [['Trapped'], ['Medical emergency'], ['Injured', 'Trapped'], ['Need food', 'Need water'], ['Need water']][simCount % 5];
  const names = ['Phone-A', 'Phone-B', 'Phone-C', 'Phone-D'];
  const hops = 1 + (simCount % 3);
  const id = 'sim' + Date.now();
  upsert(id, {
    sender: 'Survivor-' + (101 + simCount), text: SIM_TEXTS[simCount % 5], people: 1 + (simCount % 4), tags,
    lat: c.lat + (Math.random() - .5) * 0.01, lng: c.lng + (Math.random() - .5) * 0.01,
    createdAt: Date.now(), path: ['Survivor-' + (101 + simCount), ...names.slice(0, hops)], _sim: true,
  }, true);
  simCount++;
  render();
};

// ---------- settings
const dlg = document.getElementById('settings');
document.getElementById('settingsBtn').onclick = () => { document.getElementById('dbInput').value = dbUrl; dlg.showModal(); };
document.getElementById('closeSettings').onclick = () => dlg.close();
document.getElementById('saveSettings').onclick = () => {
  dbUrl = document.getElementById('dbInput').value.trim();
  store.set('nosignal.db', dbUrl);
  dlg.close();
  connect();
};
document.getElementById('clearSim').onclick = () => {
  Object.keys(messages).forEach(id => { if (messages[id]._sim) remove(id); });
  render(); dlg.close();
};

connect();
</script>
</body>
</html>
